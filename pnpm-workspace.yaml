  '@eslint/js': ^9.39.0
  '@hono/node-server': ^2.1.5
  '@hono/zod-validator': ^0.9.1
  '@playwright/test': ^1.64.1
  '@tailwindcss/postcss': ^4.3.3
  '@tanstack/react-query': ^5.104.3
  '@testing-library/dom': ^10.4.0
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.8
  '@types/node': ^22.19.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  eslint: ^9.39.5
  eslint-config-next: 16.4.1
  globals: ^17.13.0
  hono: ^4.13.13
  jsdom: ^30.1.3
  next: 16.4.1
  postgres: ^3.4.9
  prettier: ^3.9.10
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  tsdown: ^0.23.1
  tsx: ^4.23.15
  turbo: ^2.11.8
  typescript: ~6.0.3
  typescript-eslint: ^8.71.2
  vite: ^8.3.4
  vitest: ^5.0.5
  zod: ^4.6.7

# pnpm 11 默认禁止依赖的安装脚本，这里显式放行需要编译/下载二进制的包
allowBuilds:
  esbuild: true
  unrs-resolver: true
